name: Weekly AI news brief

on:
  schedule:
    # Mondays at 08:00 UTC (03:00 Bogotá / 04:00 CDMX)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (no email, only artifact)"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          ARGS="--lookback-days ${{ github.event.inputs.lookback_days || '7' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m ai_news_agent $ARGS

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-preview-${{ github.run_id }}
          path: out/preview.html
          if-no-files-found: ignore
          retention-days: 14
